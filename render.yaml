# Render Blueprint: one always-on web service running the ASTRA container.
#
# Render injects $PORT and requires the app to bind 0.0.0.0:$PORT — the
# container entrypoint already does (phone app + reverse proxy to the backend).
#
# Deploy: push this file and, in the Render dashboard, create a Blueprint from
# the repo (or "New > Web Service" pointing at this Dockerfile), then set the
# two secrets. A persistent disk keeps the bot's subscriber list across deploys.

services:
  - type: web
    name: astra
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: ASTRA_DATA_SOURCE
        value: live
      - key: ASTRA_LIVE_CANDLE_PAIR
        value: PAXGUSD
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # set in the dashboard; never stored in git
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false          # free Groq key; enables the AI advisor tab. Empty = "not configured"
      - key: VAPID_PUBLIC_KEY
        sync: false          # free, generated locally; both empty = Web Push off (in-app alerts only)
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false          # optional contact claim, e.g. mailto:you@example.com
      - key: ASTRA_UPGRADE_URL
        sync: false          # Stripe Payment Link; empty = gate off (all free)
      - key: ASTRA_ACCESS_TOKEN
        sync: false          # the phone app's access key. Empty = app is open; set here
                             # (and the same value as the repo secret of that name, which
                             # the keepalive/watchdog/daily workflows send as a cookie).
      - key: ASTRA_FREE_LEVELS
        value: "2"
      - key: ASTRA_PRO_LEVELS
        value: "50"
      - key: ASTRA_ACCOUNTS
        value: ""            # "1" turns on per-user account keys with expiry.
                             # Empty keeps the single ASTRA_ACCESS_TOKEN model.
      - key: ASTRA_ACCOUNTS_FILE
        value: "/root/.astra/accounts.json"   # on the persistent disk below
      - key: ASTRA_TRUST_FORWARDED_FOR
        value: "1"           # Render overwrites X-Forwarded-For, so the gate may
                             # attribute a failed guess to the real client. Without
                             # this the header is ignored and every visitor shares
                             # the proxy's address in the rate-limit bookkeeping.
    disk:
      name: astra-state
      mountPath: /root/.astra
      sizeGB: 1
