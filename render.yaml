# Render Blueprint: one always-on web service running the ASTRA container.
#
# Render injects $PORT and requires the app to bind 0.0.0.0:$PORT — the
# container entrypoint already does (phone app + reverse proxy to the backend).
#
# Deploy: push this file and, in the Render dashboard, create a Blueprint from
# the repo (or "New > Web Service" pointing at this Dockerfile), then set the
# two secrets. A persistent disk keeps the bot's subscriber list across deploys.

services:
  - type: web
    name: astra
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: ASTRA_DATA_SOURCE
        value: live
      - key: ASTRA_LIVE_CANDLE_PAIR
        value: PAXGUSD
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # set in the dashboard; never stored in git
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false          # free Groq key; enables the AI advisor tab. Empty = "not configured"
      - key: MISTRAL_API_KEY
        sync: false          # alternative provider key (EU-hosted free tier). Sign-up
                             # is not region-locked, so this is the fallback when
                             # Groq/Gemini refuse to issue a key from your region.
      - key: ASTRA_ADVISOR_PROVIDER
        value: "mistral"     # groq (default), gemini or mistral. Must name the
                             # provider whose *_API_KEY above is actually set.
                             # Left empty it resolves to the empty string, not to
                             # the "groq" default, and every model surface — the
                             # advisor, the AI engine and the SMC engine — answers
                             # "not configured" no matter which keys are present.
      - key: ASTRA_ENABLE_SMC
        value: "1"           # "1" turns the isolated SMC/ICT analysis engine on.
                             # It computes its fact sheet from closed bars and
                             # answers /smc; with ASTRA_SMC_ALERTS on, the bot
                             # also pushes a fresh setup it is confident in.
      - key: ASTRA_SMC_ALERTS
        value: "1"           # "1" lets the bot push a fresh SMC/ICT setup
                             # instead of waiting for /smc. Off ("0") keeps the
                             # engine on but silent. The push is gated: at most
                             # one engine read per ASTRA_SMC_ALERT_INTERVAL
                             # (default 900s) and only for a plan the model
                             # scored at or above ASTRA_SMC_ALERT_MIN_CONFIDENCE
                             # (default 0.5), so it is a handful of reads a day,
                             # not one per bar.
      - key: ASTRA_SMC_ALERT_INTERVAL
        value: "900"         # seconds between SMC engine reads (default 900).
                             # 900 = at most 96 reads/day. Raise it to spend less
                             # of the model's token quota; lower it to react
                             # sooner. The engine caches for its own TTL, so a
                             # value below that TTL only re-reads the cache.
      - key: ASTRA_SMC_ALERT_MIN_CONFIDENCE
        value: "0.5"         # lowest model confidence worth pushing (default
                             # 0.5 = 50%). A plan the model left unscored is
                             # never pushed: "sure" cannot be claimed without a
                             # number. /smc still shows every plan.
      - key: VAPID_PUBLIC_KEY
        sync: false          # free, generated locally; both empty = Web Push off (in-app alerts only)
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false          # optional contact claim, e.g. mailto:you@example.com
      - key: ASTRA_UPGRADE_URL
        sync: false          # Stripe Payment Link; empty = gate off (all free)
      - key: ASTRA_ACCESS_TOKEN
        sync: false          # the phone app's access key. Empty = app is open; set here
                             # (and the same value as the repo secret of that name, which
                             # the keepalive/watchdog/daily workflows send as a cookie).
      - key: ASTRA_FREE_LEVELS
        value: "2"
      - key: ASTRA_PRO_LEVELS
        value: "50"
      - key: ASTRA_ACCOUNTS
        value: ""            # "1" turns on per-user account keys with expiry.
                             # Empty keeps the single ASTRA_ACCESS_TOKEN model.
      - key: ASTRA_ACCOUNTS_FILE
        value: "/root/.astra/accounts.json"   # on the persistent disk below
      - key: ASTRA_TRUST_FORWARDED_FOR
        value: "1"           # Render overwrites X-Forwarded-For, so the gate may
                             # attribute a failed guess to the real client. Without
                             # this the header is ignored and every visitor shares
                             # the proxy's address in the rate-limit bookkeeping.
    disk:
      name: astra-state
      mountPath: /root/.astra
      sizeGB: 1
