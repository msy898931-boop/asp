services:
  astra:
    build: .
    image: astra-server
    container_name: astra
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Synthetic data source so the pipeline runs with no MT5 terminal. Set to
      # "mt5" (and run on Windows) to use a live terminal instead.
      ASTRA_DATA_SOURCE: "replay"
    ports:
      # Loopback-only: the API is never exposed to the public internet.
      - "127.0.0.1:8790:8790"
    volumes:
      # Durable subscriber list (survives container rebuilds).
      - astra-state:/root/.astra

volumes:
  astra-state:
