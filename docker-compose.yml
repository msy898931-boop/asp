services:
  astra:
    build: .
    image: astra-server
    container_name: astra
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Live market data over the network (gold-api.com spot + Kraken candles, no key,
      # no terminal), so the always-on host serves real prices. Set to "replay" for an
      # offline demo, or "mt5" on a Windows host with a live terminal.
      ASTRA_DATA_SOURCE: "live"
      ASTRA_LIVE_CANDLE_PAIR: "PAXGUSD"
      # The measured-geometry plan (a 0.5R target) built from the fact sheet with
      # no model call, so it survives a paused/refused/unconfigured provider. It
      # is opt-in like every other measurement here; set to "1" to show it beside
      # the model's plan in /smc and the phone panel.
      ASTRA_SMC_DETERMINISTIC_PLAN: "1"
    ports:
      # Public: the phone app (PWA) plus the reverse proxy to the loopback API.
      # The API and bridge themselves are never bound to a public interface.
      - "8790:8080"
    volumes:
      # Durable subscriber list (survives container rebuilds).
      - astra-state:/root/.astra

volumes:
  astra-state:
