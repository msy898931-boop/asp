# TEMPORARY verification of the chain re-arm. Deleted right after it proves the
# GITHUB_TOKEN + workflow_dispatch mechanism works in this repo.
name: _chain_test

on:
  workflow_dispatch:
    inputs:
      depth:
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: report
        run: echo "depth=${{ github.event.inputs.depth }} run=${{ github.run_id }}"
      - name: re-arm once
        if: ${{ github.event.inputs.depth == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/_chain_test.yml/dispatches" \
            -d '{"ref":"main","inputs":{"depth":"1"}}')
          echo "re-arm HTTP $code (204 = queued)"
          [ "$code" = "204" ]
