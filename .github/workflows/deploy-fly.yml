name: Deploy (Fly.io)

# Deploys the always-on ASTRA service to Fly.io. Run it from the Actions tab.
# Everything the running service needs — the phone app and the Telegram bot —
# ships in one container. This is manual-only: the live host is Render, and a
# missing FLY_API_TOKEN would otherwise turn every push red.
#
# One-time setup (see DEPLOY.md):
#   1. Create the app:      fly launch --no-deploy   (or `fly apps create <name>`)
#   2. Store the bot creds: fly secrets set TELEGRAM_BOT_TOKEN=... TELEGRAM_CHAT_ID=...
#   3. Add a repo secret:   FLY_API_TOKEN=<a token from `fly tokens create org`>
#
# The Telegram token + chat id are set as Fly secrets, not GitHub secrets, so
# they live only on the host.

on:
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # --ha=false and a single machine are deliberate: two pollers on the
        # same bot token make Telegram answer 409 Conflict.
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify the deployment
        run: ./scripts/check_deploy.sh "https://$(flyctl status --json | python3 -c 'import sys,json;print(json.load(sys.stdin)["Hostname"])')"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
