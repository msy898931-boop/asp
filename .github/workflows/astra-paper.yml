# Paper trading: run the pre-specified rule on live bars, forward in time.
#
# Plan C found a rule that cleared a significance test but not the promotion
# gate (too few trades to separate from break-even). The only honest way to
# settle it is out-of-sample on data it has never seen, so this job shadows the
# live bot: it fetches the same closed bars, replays the engine, and records the
# trades the rule would have taken to an append-only ledger. It places no
# orders, touches no live state, and changes no engine code.
#
# Every 15 minutes, aligned to the M15 bar close. The ledger and the state ride
# in the Actions cache, keyed to a single scope so every run reads and writes
# the same entry; a lost cache re-primes silently rather than blasting history.
#
# Free, like the signal bot: a cron, a small state file, one message when the
# rule trades or once a day.
#
# Required repository secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Without them the job prints the read (dry mode) and exits zero.

name: astra-paper

on:
  schedule:
    # A few minutes past each M15 close, so the newest bar has closed when we
    # read. GitHub's cron is best-effort; a late slot only changes latency.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the read instead of recording it"
        type: boolean
        default: false
      notify:
        description: "Send the read to Telegram even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: astra-paper
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore paper state
        uses: actions/cache/restore@v4
        with:
          path: |
            run/paper_trades.jsonl
            run/paper_state.json
          key: astra-paper-${{ github.run_id }}
          restore-keys: |
            astra-paper-

      - name: Run the tests
        run: python3 -m unittest discover -s bot -p "test_paper_trade.py"

      - name: Observe the rule on live bars
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.notify }}" = "true" ]; then ARGS="$ARGS --notify"; fi
          python3 bot/paper_trade.py $ARGS

      - name: Save paper state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            run/paper_trades.jsonl
            run/paper_state.json
          key: astra-paper-${{ github.run_id }}
