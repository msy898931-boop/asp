name: Build Android APK

# Builds the installable phone app (android/) with no Gradle and no Android
# Studio: a JDK 17 plus the SDK build-tools are enough (see android/build.sh).
# The keystore is cached so successive builds share a signature and an installed
# app can be updated in place instead of uninstalled first.

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'ASTRA server URL baked into the app (changeable on-device)'
        required: false
        default: 'http://127.0.0.1:12001/'
      app_name:
        description: 'Launcher name'
        required: false
        default: 'ASTRA'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK, but sdkmanager is not on PATH.
      # Resolve the SDK root and add its cmdline-tools before installing the
      # exact build-tools/platform build.sh expects.
      - name: Install build-tools and platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$SDK/platform-tools:$PATH"
          echo "SDK=$SDK"
          command -v sdkmanager || ls "$SDK"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # A stable keystore means an update installs over the previous build. The
      # first run generates it; later runs restore it from the cache.
      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: android/astra.keystore
          key: astra-keystore-v1

      - name: Build APK
        env:
          SERVER_URL: ${{ github.event.inputs.server_url || 'http://127.0.0.1:12001/' }}
          APP_NAME: ${{ github.event.inputs.app_name || 'ASTRA' }}
        run: android/build.sh --url "$SERVER_URL" --name "$APP_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astra-apk
          path: android/dist/astra.apk
          retention-days: 30
          if-no-files-found: error

      # Publish to a rolling `android` release so the web app's footer link
      # resolves to a permanent download instead of a local file the server
      # may not have. Whoever installs it sets their own server address on
      # first launch, so this one APK works against any deployment.
      - name: Publish APK to the rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: ASTRA Mobile (Android)
          body: |
            The installable phone app. On first launch it asks for your ASTRA
            server address (e.g. `http://your-host:12001/`); you can change it
            later from the error screen. Read-only, shadow mode, no credentials.

            _Published by an AI agent (OpenHands) on behalf of @msy898931-boop._
          files: android/dist/astra.apk
          make_latest: false
