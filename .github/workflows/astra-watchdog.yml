# Watchdog: the one job that reports on the others.
#
# Runs hourly. It is a dead-man's switch over three silent failures: the bot
# stopped running, the web server is down, or the repository has gone quiet long
# enough (~60 days) that GitHub disables the scheduled workflows outright. It
# alerts on the transition into trouble, re-alerts every few hours while the
# trouble lasts, and confirms recovery. All of that is free: GitHub Actions on a
# public repo, plus one curl to the server.
#
# Required repository secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# GITHUB_TOKEN is provided by Actions and used only to read this repo's runs.

name: astra-watchdog

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the verdict instead of sending it"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: astra-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore watchdog state
        uses: actions/cache/restore@v4
        with:
          path: run/watchdog_state.json
          key: astra-watchdog-state-${{ github.run_id }}
          restore-keys: |
            astra-watchdog-state-

      - name: Run the tests
        run: python3 -m unittest discover -s bot -p "test_watchdog.py"

      - name: Check the fleet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASTRA_URL: ${{ vars.ASTRA_URL || 'https://astra-xlp9.onrender.com' }}
          # The phone server's optional access gate. Present only when the
          # operator set it; a blank secret leaves monitoring unauthenticated,
          # which is correct when the gate is off.
          ASTRA_ACCESS_TOKEN: ${{ secrets.ASTRA_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 bot/watchdog.py --dry-run
          else
            python3 bot/watchdog.py
          fi

      - name: Save watchdog state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: run/watchdog_state.json
          key: astra-watchdog-state-${{ github.run_id }}
