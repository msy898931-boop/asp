name: Build Windows .exe

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/qt/**'
      - 'src/**'
      - 'bridge/**'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8
        # Qt 6.5.x headers (qvarlengtharray.h) use 'stdext', which fails on the
        # runner's newer MSVC. Qt 6.8 is built with MSVC 2022 and is compatible.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          dir: ${{ runner.temp }}\Qt
          cache: 'true'

      - name: Configure CMake
        # Single line: the runner shell is PowerShell, so cmd's '^' continuation
        # is not valid. Let CMake pick the installed Visual Studio generator.
        run: cmake -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBUILD_ASTRA_DESKTOP=ON
        working-directory: frontend/qt

      - name: Build Release
        run: cmake --build build --config Release --parallel
        working-directory: frontend/qt

      - name: Deploy with windeployqt
        run: |
          $exe = "build/bin/Release/astra_desktop.exe"
          if (-Not (Test-Path $exe)) {
            Write-Error "Executable not found at $exe"
            Get-ChildItem -Path build -Recurse -Include "*.exe"
            exit 1
          }
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-compiler-runtime $exe
          Write-Host "windeployqt completed for $exe"
        working-directory: frontend/qt

      - name: Package deployment folder
        run: |
          $deployDir = "build/bin/Release"
          $zipPath = "build/ASTRA-windows.zip"
          Compress-Archive -Path "$deployDir\*" -DestinationPath $zipPath -Force
          Write-Host "Packaged to $zipPath"
          Get-Item $zipPath | Select-Object Name, Length
        working-directory: frontend/qt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-windows
          path: frontend/qt/build/ASTRA-windows.zip
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------------------
      # Full runnable bundle: the desktop exe is only the UI; it needs the
      # backend host (bridge + runtime) beside it. Build the host, embed a
      # private interpreter, stage resources/, and ship one folder.
      # ------------------------------------------------------------------
      - name: Build backend host
        run: cmake --build build --config Release --target aura_backend_host --parallel
        # root CMakeLists (working directory defaults to the repo root)

      - name: Stage full bundle
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          # One-file layout: the host looks for resources/ next to itself, so
          # the UI and the host share the app root.
          $root = "frontend/qt/build/bin/Release"
          python scripts/bundle.py --out "$root" --backend-host "build/Release/aura_backend_host.exe"
          python scripts/embed_python.py --dest "$root/resources/python" --python-exe "$py"
          Copy-Item "frontend/qt/build/ASTRA-windows.zip" "$root/ASTRA-windows.zip" -Force
          Compress-Archive -Path "$root\*" -DestinationPath "build/ASTRA-full.zip" -Force
          Get-Item "build/ASTRA-full.zip" | Select-Object Name, Length

      - name: Upload full bundle
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-full-windows
          path: build/ASTRA-full.zip
          retention-days: 30
          if-no-files-found: error

