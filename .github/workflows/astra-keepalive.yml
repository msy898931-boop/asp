# Keeps the free Render instance awake around the clock.
#
# Render's free plan spins an idle service down after ~15 minutes. The service
# holds the phone app AND the interactive Telegram bot (the backend launches the
# bot whenever TELEGRAM_BOT_TOKEN is set), so a sleeping instance means a cold
# start on the next app open and a bot that is not answering.
#
# Cron is not enough to prevent that. GitHub's cron is best-effort, and on this
# repo a 5-minute schedule has landed anywhere from 20 to 75 minutes apart —
# longer than the 15-minute sleep window, so the instance sleeps before the next
# tick. A keepalive cannot be built on a trigger that is slower than the thing
# it is racing.
#
# So this job does not depend on cron for its cadence. It runs for close to the
# 6-hour job limit, pinging every 5 minutes, then re-arms itself with a
# workflow_dispatch just before it ends. Each run re-arms the next, so the chain
# keeps the service awake indefinitely. `astra-chain-guard.yml` is the safety
# net: it runs on a cron and re-dispatches this one if no run is in progress.
#
# Cost: free. Actions minutes are unmetered on a public repo, and the steady
# pings keep the Render service inside its monthly free allowance (750
# instance-hours; a calendar month is ~730).

name: astra-keepalive

on:
  # Dispatch only. The chain re-arms itself; a separate guard
  # (`astra-chain-guard.yml`) restarts it if a re-arm is ever missed. A cron
  # here would share this workflow's concurrency group, queue behind the
  # running chain, then start a redundant second chain when it finally ran.
  workflow_dispatch:

permissions:
  contents: read
  actions: write        # required for the workflow_dispatch re-arm below

concurrency:
  group: astra-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # Worst case: canary ~12 min + warm loop ~5h17m + one overshoot iteration
    # (~6 min) + re-arm. The 345-minute cap keeps the total under the hard
    # 6-hour job limit with margin.
    timeout-minutes: 345
    env:
      ASTRA_URL: ${{ vars.ASTRA_URL || 'https://astra-xlp9.onrender.com' }}
    steps:
      - name: Canary — the deploy must serve real data, not just answer 200
        run: |
          set -u
          # Warm the service first: the canary can spend minutes retrying, and
          # this run must not leave a gap longer than the 15-minute sleep window
          # after the previous run's last ping.
          curl -s -o /dev/null -w "warm-up health HTTP %{http_code}\n" -m 60 "$ASTRA_URL/api/v1/health" || true
          echo "deployed version:"
          curl -s -m 60 "$ASTRA_URL/version.json" || true
          echo
          # A 200 with an empty engine is the exact bug that shipped the News
          # tab broken. Read the body and fail the run if it is empty. Retry,
          # because the study replays the corpus and a cold instance is slow.
          for attempt in 1 2 3 4 5; do
            body=$(curl -s -m 120 "$ASTRA_URL/akoan.json" || echo "")
            if echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('available'); assert d.get('scored',0)>0; print('engine ok:', d['verdict'], d['scored'], 'scored')" 2>/dev/null; then
              exit 0
            fi
            echo "attempt $attempt: engine not ready yet"
            sleep 15
          done
          echo "engine never served data; last body:" >&2
          echo "$body" | head -c 300 >&2
          exit 1

      - name: Keep the service warm
        # Runs even if the canary failed: the point of this job is the chain,
        # and a bad deploy must not also stop the pings.
        if: always()
        run: |
          set -u
          # ~5h17m. Leaves room for the canary and the re-arm under the cap.
          deadline=$(( $(date +%s) + 19000 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$ASTRA_URL/api/v1/health" || echo "000")
            echo "$(date -u +%H:%M:%S) health HTTP $code"
            sleep 300
          done

      - name: Re-arm the chain
        # Always, so the chain survives a canary failure. If this dispatch
        # fails, the cron trigger restarts the chain within the hour.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/astra-keepalive.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "re-arm dispatch HTTP $code (204 = queued)"
          [ "$code" = "204" ] || echo "re-arm failed; the cron safety net will restart the chain" >&2
