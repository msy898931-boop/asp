name: CI

# Two independent guarantees on every push:
#   * the backend still builds and its deterministic tests pass, and
#   * the published research baseline still reproduces bit-for-bit within
#     tolerance (scripts/verify_baseline.py).
# The frontend has no build step; app.js is checked for syntax with node.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: The bot's volatility features must match the real engine
        run: python3 bridge/telegram_bot/test_volatility_parity.py

      - name: The real host must honour the frozen v1 contract (T13, E05)
        # The mock is only a twin; T13 starts the just-built host and checks
        # every route against the frozen schema. Run both postures: the default
        # no-data checkout, and the evidential real-corpus replay that catches
        # host/schema shape drift the mock never exercised.
        run: |
          python3 tests/integration/test_e2e_real_host_t13.py
          T13_REAL_DATA=1 python3 tests/integration/test_e2e_real_host_t13.py

  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the published baseline reproduces
        run: python3 scripts/verify_baseline.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the Web Push crypto (the one non-stdlib runtime dep)
        # Only the Web Push tests need it; the shipped service imports it
        # lazily and stays on the standard library when it is absent.
        run: python3 -m pip install pywebpush==2.5.0

      - name: Syntax-check the phone app
        run: |
          for f in app i18n panels advisor tracker alerts vol akoan ticker; do
            node --check "mobile/$f.js"
          done
          node --check mobile/sw.js
          node --check mobile/terminal.js

      - name: Every offline-shell asset must exist
        run: python3 mobile/check_shell.py

      - name: Test the phone server's volatility route
        run: |
          python3 mobile/test_serve_mobile.py
          python3 mobile/test_gate.py
          python3 mobile/test_shell_contract.py

      - name: Test Web Push (store, routes, real encryption round trip)
        run: python3 mobile/test_webpush.py

      - name: Test the web terminal
        run: python3 mobile/test_terminal.py

      - name: Install the browser and the driver
        # The DOM tests drive the real shell in a real browser. They are the
        # only check that a control works rather than merely exists; every
        # other phone test reads the source as text.
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Test the phone UI in a real browser
        # test_dom_data seeds the endpoints from scripts/mock_api.py and asserts
        # on the rendered DOM; test_dom_browser runs the same shell with every
        # endpoint dead. Between them: the panels show real values, and the app
        # still works when the backend is gone.
        run: |
          python3 mobile/test_dom_browser.py
          python3 mobile/test_dom_data.py

      - name: Test the signal engine and its honesty guarantees
        run: python3 -m unittest discover -s tracker -p "test_*.py"

      - name: Test the AI advisor's parsing and not-configured degradation
        run: python3 -m unittest discover -s advisor -p "test_*.py"

      - name: Test the bot's alerts, watchdog and one-shot scanner
        run: python3 -m unittest discover -s bot -p "test_*.py"

      - name: Test the Phase 0 volatility-probe math
        run: python3 -m unittest discover -s research -p "test_*.py"

      - name: Test the akoan news-statistics engine
        run: python3 -m unittest discover -s akoan -p "test_*.py"

      - name: The akoan study must reproduce over the committed corpus
        run: |
          python3 akoan/study.py --json > /tmp/akoan_study.json
          python3 -c "import json,sys; r=json.load(open('/tmp/akoan_study.json')); assert r['scored']>0, r; assert r['verdict'] in ('NO_EDGE_MEASURED','EDGE_CANDIDATE','INSUFFICIENT_DATA'), r; print('akoan study:', r['verdict'], r['scored'], 'scored')"

      - name: The news-move table must still reproduce
        # news_forecast.py ships a measured move table. If the corpus or the
        # event ledger changes under it, the shipped numbers go stale silently;
        # this fails the build instead. It also re-asserts the honesty claim:
        # the surprise read must NOT predict direction (no 95% agreement).
        run: |
          python3 scripts/measure_news_move.py --json > /tmp/news_move.json
          python3 -c "
          import json
          d=json.load(open('/tmp/news_move.json'))
          t=d['table']; c=d['direction_check']
          assert t['60']['n'] >= 50, t
          assert 2.0 <= t['60']['median'] <= 12.0, t
          assert t['15']['median'] < t['30']['median'] < t['60']['median'], t
          for h in ('15','30','60'):
              hit=c[h].get('hit_rate')
              assert hit is not None and 35 <= hit <= 65, (h, c[h])
          print('news-move table reproduces:', {h: t[h]['median'] for h in t})
          "

      - name: Test the paid-tool layer (tiers + price levels)
        run: |
          python3 bridge/telegram_bot/test_entitlements.py
          python3 bridge/telegram_bot/test_astra_bot.py
          python3 bridge/telegram_bot/test_volatility.py

      - name: Test the bot over its real transports
        # The suite above fakes the backend and Telegram; this one starts real
        # loopback servers and lets the production urllib clients talk to them.
        # It is the only check that the frozen contract, the bridge envelope and
        # the Bot API calls are actually wired.
        run: python3 bridge/telegram_bot/test_astra_connection.py

      - name: The desktop bundle must ship its launcher
        # Two executables land side by side and the Qt UI is useless alone (it
        # polls 127.0.0.1:8790). The stager also writes ASTRA.bat + README.txt,
        # and this keeps that contract from silently regressing.
        run: python3 tests/integration/test_bundling_t07.py

  quality:
    # Lint, types and coverage over the Python side. These are cheap and
    # catch whole classes of defect (dead ignores, unhandled Optional,
    # untested branches) that the functional jobs above would let through.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the quality tools
        run: python3 -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type-check the shipped source
        # `research/` is exploratory analysis, not shipped code, so it stays
        # out of the gate; everything the service runs is in scope.
        run: mypy bot tracker akoan advisor bridge mobile src

      - name: Run every suite under coverage
        run: |
          for d in bot tracker research akoan advisor mobile tests; do
            python3 -m coverage run -a \
              --source=bot,tracker,research,akoan,advisor,mobile,src \
              -m unittest discover -s "$d" -p "test_*.py"
          done
          python3 -m coverage run -a \
            --source=bot,tracker,research,akoan,advisor,mobile,src \
            -m unittest discover -s bridge/telegram_bot -p "test_*.py"

      - name: Coverage floor
        run: python3 -m coverage report --fail-under=75

  container:
    # What ships is the image, not the source tree — and every other job runs
    # against the source tree. A route can therefore reference a module the
    # Dockerfile never copies and still pass them all; the phone's News tab
    # shipped broken exactly that way. This builds the real image and asks the
    # running service for the routes that depend on their module being present.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t astra-ci .

      - name: The image must serve the akoan route from its own contents
        run: |
          docker run -d --name astra-ci -p 8080:8080 -e ASTRA_DATA_SOURCE=replay astra-ci
          trap 'docker logs astra-ci || true; docker rm -f astra-ci || true' EXIT
          python3 - <<'PY'
          import json, time, urllib.request
          url = "http://127.0.0.1:8080/akoan.json"
          last = None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=60) as fh:
                      body = json.load(fh)
                  if body.get("available"):
                      break
                  last = body
              except Exception as exc:
                  last = exc
              time.sleep(3)
          else:
              raise SystemExit("akoan route never became available: %r" % (last,))
          assert body.get("scored", 0) > 0, body
          assert (body.get("coverage") or {}).get("events", 0) > 0, body
          print("container akoan:", body["verdict"], body["scored"], "scored")
          PY

      - name: The image must ship the Web Push crypto
        # /push.json reports available:true only when the VAPID keys are set
        # AND pywebpush imports. A source-tree test cannot prove the library
        # made it into the image, so ask the image itself with throwaway keys.
        # These keys are CI-only and deliberately public; they are not a secret.
        run: |
          docker run -d --name astra-push -p 8081:8080 \
            -e ASTRA_DATA_SOURCE=replay \
            -e VAPID_PUBLIC_KEY=BOik3kRY12mH7VKvIf5CQjv3xHn8HnCQlI1GLsHY-3t92TXwUazvQPYz1QwUpIWIn0HO7gsYY4pYA5e5hMFXRmc \
            -e VAPID_PRIVATE_KEY=xo-_slvMsJVMFcVVGLF89nBs9SfcqXk1S4woMl8TAIM \
            astra-ci
          trap 'docker logs astra-push || true; docker rm -f astra-push || true' EXIT
          python3 - <<'PY'
          import json, time, urllib.request
          url = "http://127.0.0.1:8081/push.json"
          body = None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=30) as fh:
                      body = json.load(fh)
                  if body.get("available"):
                      break
              except Exception:
                  body = None
              time.sleep(3)
          assert body and body.get("available"), body
          assert body.get("public_key"), body
          print("container web push: available, key present")
          PY
