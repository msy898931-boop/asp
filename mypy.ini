# Type checking for the Python side of the tree.
#
# Scope is the shipped source, not the tests: the suites are written in the
# stdlib-unittest style and lean on duck-typed fakes, so a strict pass over
# them would demand annotations that add noise without catching real bugs.
# The source, on the other hand, is where an Optional that slips through turns
# into a production crash — that is what this gate is for.

[mypy]
python_version = 3.11

# The tree has no `__init__.py` at every level and two files share a leaf name
# (`akoan/study.py`, `research/features_real/study.py`), which confuses module
# resolution. Package bases are derived from the paths given on the command
# line instead, so the two never collide.
explicit_package_bases = True

# The C++ backend and the MT5 terminal are not importable here; the tree
# guards those imports at runtime, so missing stubs are not findings.
ignore_missing_imports = True

# Check the shipped source only. `test_*` and `tests/` are excluded so the
# gate stays about behaviour that runs in production.
exclude = (?x)(
    (^|/)tests?/
  | (^|/)test_[^/]*\.py$
  | (^|/)conftest\.py$
  )

# Each file is checked in isolation rather than by following imports, which
# keeps a single run fast and avoids cross-package name collisions.
follow_imports = silent

# A `# type: ignore` that no longer suppresses anything is dead weight; fail
# on it so stale ignores get cleaned up.
warn_unused_ignores = True
